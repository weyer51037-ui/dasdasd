name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Resolve Fabric versions
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          API=$(curl -fsS -G 'https://api.modrinth.com/v2/project/fabric-api/version' \
                 --data-urlencode "game_versions=[\"$MC\"]" --data-urlencode 'loaders=["fabric"]' \
                 -H 'User-Agent: venzils-pvp-essentials-ci' | jq -r '.[0].version_number')
          LOADER=$(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          echo "Minecraft $MC | Fabric API $API | Loader $LOADER"
          if [ -z "$API" ] || [ "$API" = "null" ]; then echo "No Fabric API found for $MC yet"; exit 1; fi
          echo "ORG_GRADLE_PROJECT_fabric_api_version=$API" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_loader_version=$LOADER" >> "$GITHUB_ENV"

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: venzils-pvp-essentials
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
